<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de CRUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>CRUD - 6🫲😵🫴7</h1>
        <button id="btn-tema">🌓 Trocar Tema</button>
    </div>

    <div class="grid">
        <!-- Autenticação e Cadastro -->
        <div>
            <div class="card" style="margin-bottom: 20px;">
                <h2>Login</h2>
                <form id="formLogin">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                    <input type="password" id="loginSenha" placeholder="Senha" required>
                    <button type="submit">Entrar</button>
                </form>
            </div>

            <div class="card">
                <h2>Cadastrar Usuário</h2>
                <form id="formCadastro">
                    <input type="text" id="nome" placeholder="Nome" required>
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="password" id="senha" placeholder="Senha" required>
                    <button type="submit">Cadastrar</button>
                </form>
            </div>
        </div>

        <!-- Listagem de Banco -->
        <div class="card">
            <h2>Banco de Dados</h2>
            <button id="btnAtualizar" style="margin-bottom: 15px;">Atualizar Lista</button>
            <pre id="output">Os dados aparecerão aqui...</pre>
        </div>
        
        <div class="card" style="margin-top: 20px;">
            <h2>Excluir Usuário</h2>
            <form id="formDelete">
                <input type="number" id="deleteId" placeholder="ID do Usuário" required>
                <button type="submit" style="background: #ef4444; color: #fff;">Deletar Usuário</button>
            </form>
        </div>
    <!-- Adiciona abaixo do card de exclusão no index.html -->
    <div class="card" style="margin-top: 20px;">
        <h2>Atualizar Usuário</h2>
        <form id="formUpdate">
            <input type="number" id="updateId" placeholder="ID do Usuário" required>
            <input type="text" id="updateNome" placeholder="Novo Nome" required>
            <input type="email" id="updateEmail" placeholder="Novo Email" required>
            <button type="submit" style="background: #3b82f6; color: #fff;">Salvar Alterações</button>
        </form>
    </div>


    <script src="app.js"></script>
</body>
</html>
